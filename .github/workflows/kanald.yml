name: KanalD Scraper

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  schedule:
    - cron: '0 9 * * *' # Her gün saat 09:00 UTC (TSİ 12:00)

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Repo'yu checkout et
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Tüm geçmişi çeker, rebase işlemleri için gereklidir

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Paketleri yükle
        run: |
          pip install requests beautifulsoup4 cloudscraper

      - name: Scripti çalıştır
        run: python kanald.py

      - name: Git yapılandırması
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name  "GitHub Actions"

      - name: M3U Çıktısını Commit Et ve Çakışmayı Çöz
        run: |
          # 1. Oluşan yeni dosyayı sahneye al (stage)
          git add kanald.m3u
          
          # 2. Değişiklik yoksa işlemi bitir
          if git diff --staged --quiet; then
            echo "Değişiklik yok, commit atılmadı."
            exit 0
          fi
          
          # 3. Yerel commit'i oluştur
          git commit -m "Kanal D playlist güncellendi [$(date +"%Y-%m-%d %H:%M:%S")]"
          
          # 4. Uzaktaki (remote) en son değişiklikleri çek ve rebase yap
          #    (Böylece senin commit'in en son commit'in üzerine eklenir)
          git pull --rebase origin main
          
          # 5. Push işlemini gerçekleştir
          git push origin main
