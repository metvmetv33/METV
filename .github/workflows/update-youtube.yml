name: YouTube Canlı Yayın Güncelle

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
  push:
    paths:
      - 'youtube.json'

jobs:
  update:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: 📥 Repo'yu klonla
        uses: actions/checkout@v4

      - name: 🐍 Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📺 YouTube canlı yayınları güncelle
        run: python update_youtube.py

      # ⚠️ Hem youtube2.txt hem youtube.json commit edilir
      - name: 💾 Değişiklikleri kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add youtube2.txt youtube.json
          git diff --quiet && git diff --staged --quiet || (
            git commit -m "🔄 YouTube canlı yayınlar güncellendi [$(date +'%Y-%m-%d %H:%M')]"
            git push
          )
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
